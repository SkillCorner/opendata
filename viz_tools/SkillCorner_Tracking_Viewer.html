document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

to; flex-wrap:wrap;\n  }\n  .brand{display:flex; align-items:center; gap:10px; flex:0 0 auto}\n  .brand svg{display:block}\n  /* official mark + wordmark, lifted from the Dynamic Events Explorer header */\n  .logoPlate{width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0}\n  .logoPlate img{width:100%; height:100%; object-fit:contain; display:block}\n  .wordmarkImg{height:15px; display:block}\n  .vrule{width:1px; height:22px; background:var(--line2); flex:0 0 auto}\n  header h1{\n    font-family:var(--display); font-weight:600; font-size:13px; letter-spacing:.09em;\n    text-transform:uppercase; margin:0; white-space:nowrap; color:var(--text);\n  }\n  header h1 span{color:var(--muted); letter-spacing:.06em}\n  .file-btn{\n    background:var(--accent); color:var(--onAccent); border:none; padding:7px 14px; border-radius:5px;\n    cursor:pointer; font-family:var(--display); font-weight:600; font-size:12px;\n    letter-spacing:.05em; text-transform:uppercase; transition:filter .15s;\n  }\n  .file-btn:hover{filter:brightness(1.08)}\n  #fileStatus{\n    color:var(--muted); font-size:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;\n    margin-left:auto;\n  }\n  #fileStatus b{color:var(--text); font-weight:500}\n  #fileStatus .score{\n    color:var(--text); font-family:var(--mono); font-weight:500; background:var(--panel2);\n    border:1px solid var(--line); padding:2px 8px; border-radius:5px; font-variant-numeric:tabular-nums;\n  }\n  #fileStatus .muted{color:var(--muted)}\n  .teamChip{width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid rgba(236,234,228,.3); flex:0 0 auto}\n  #closeFileBtn{\n    background:transparent; color:var(--muted); border:1px solid var(--line2); border-radius:5px;\n    padding:6px 12px; cursor:pointer; font-family:var(--display); font-weight:600; font-size:11px;\n    letter-spacing:.05em; text-transform:uppercase; display:none; transition:color .15s, border-color .15s;\n  }\n  #closeFileBtn:hover{color:var(--text); border-color:var(--text)}\n\n  /* ---------- load screen ---------- */\n  #loadArea{flex:1; margin:0; display:flex; flex-direction:column; min-height:0}\n  #dropzone{\n    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;\n    text-align:center; color:var(--muted); font-size:14px; padding:40px;\n    flex-direction:column; gap:16px; overflow-y:auto;\n  }\n  #dropzone b{color:var(--text); font-weight:500}\n  .hint{font-size:12px; max-width:520px; line-height:1.6; color:var(--muted)}\n\n  .dualDrop{display:flex; gap:14px; width:100%; max-width:660px}\n  .dropSlot{\n    flex:1; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:28px 16px;\n    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;\n  }\n  .dropSlot:hover{border-color:var(--muted); background:#131313}\n  .dropSlot.drag{border-color:var(--accent); background:rgba(50,254,107,.09)}\n  .dropSlot.filled{border-color:var(--accent); background:rgba(50,254,107,.07)}\n  .dropSlot input{display:none}\n  .slotIcon{color:var(--muted); margin-bottom:10px; display:flex; justify-content:center}\n  .dropSlot.filled .slotIcon, .dropSlot.drag .slotIcon{color:var(--accent)}\n  .slotTitle{\n    font-family:var(--display); font-weight:600; font-size:12px; letter-spacing:.08em;\n    text-transform:uppercase; margin-bottom:6px; color:var(--text);\n  }\n  .slotHint{font-size:11.5px; color:var(--muted); margin-bottom:12px; line-height:1.5}\n  .slotHint code{font-family:var(--mono); font-size:11px; color:var(--dim)}\n  .slotFile{font-size:12px; font-weight:500; word-break:break-all; color:var(--text)}\n  .slotFile.empty{color:var(--muted); font-weight:400}\n  .slotFile.ok{color:var(--accent)}\n\n  #continueBtn{\n    margin-top:4px; font-size:12px; padding:11px 26px;\n    opacity:.35; cursor:not-allowed; pointer-events:none; transition:opacity .15s, background .15s;\n  }\n  #conti Fdiv>\n  <h1>Tracking Viewer <span>· XY tracking data on a pitch<\u002Fspan><\u002Fh1>\n  <span id=\"fileStatus\"><\u002Fspan>\n  <span id=\"matchWarning\" style=\"color:#f0a03c; font-size:12px; display:none\"><\u002Fspan>\n  <button id=\"closeFileBtn\">Close file<\u002Fbutton>\n<\u002Fheader>\n\n<div id=\"loadArea\">\n  <div id=\"dropzone\">\n    <div class=\"dualDrop\">\n      <div class=\"dropSlot\" id=\"slotTracking\">\n        <div class=\"slotIcon\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.5\"><\u002Fcircle><path d=\"M12 1v4M12 19v4M1 12h4M19 12h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"slotTitle\">Tracking file<\u002Fdiv>\n        <div class=\"slotHint\"><code>.jsonl<\u002Fcode> / <code>.json<\u002Fcode><br>e.g. <code>*_tracking_extrapolated.jsonl<\u002Fcode><\u002Fdiv>\n        <div class=\"slotFile empty\" id=\"slotTrackingFile\">Drag here or click<\u002Fdiv>\n        <input type=\"file\" id=\"slotTrackingInput\" accept=\".json,.jsonl,.ndjson,.txt\" multiple=\"\">\n      <\u002Fdiv>\n      <div class=\"dropSlot\" id=\"slotMatch\">\n        <div class=\"slotIcon\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M8 8h8M8 12h8M8 16h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"slotTitle\">Match file<\u002Fdiv>\n        <div class=\"slotHint\"><code>.json<\u002Fcode><br>e.g. <code>*_match.json<\u002Fcode> (teams, players, pitch size)<\u002Fdiv>\n        <div class=\"slotFile empty\" id=\"slotMatchFile\">Drag here or click<\u002Fdiv>\n        <input type=\"file\" id=\"slotMatchInput\" accept=\".json,.txt\" multiple=\"\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button id=\"continueBtn\" class=\"file-btn\">Continue to viewer<\u002Fbutton>\n    <div class=\"hint\">Both files are read locally in the browser — nothing is uploaded. It doesn't matter which file goes into which slot; the app detects tracking vs. match file automatically from the content.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"mainArea\">\n  <div id=\"stage\">\n    <aside id=\"playersPanel\">\n      <section class=\"collapsible\">\n        <h3>Players <span id=\"legendCount\" style=\"color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0\"><\u002Fspan><span class=\"caret\">▼<\u002Fspan><\u002Fh3>\n        <div class=\"secBody\">\n          <div class=\"note\" style=\"margin-bottom:10px\" id=\"legendNote\">Click a player to highlight them on the pitch.<\u002Fdiv>\n          <div id=\"legendList\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Faside>\n    <div id=\"pitchWrap\">\n      <canvas id=\"pitchCanvas\" data-comment-anchor=\"37ada22db9-canvas\"><\u002Fcanvas>\n      <div id=\"hud\">\n        <div class=\"big\" id=\"hudClock\">00:00.0<\u002Fdiv>\n        <div class=\"sub\" id=\"hudMeta\">Period 1 · Frame 0<\u002Fdiv>\n        <div class=\"sub\" id=\"hudPossession\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside id=\"sidePanel\">\n      <section>\n        <h3>Playback<\u002Fh3>\n        <div class=\"btnrow\">\n          <button class=\"ctrlbtn\" id=\"stepBackBtn\" title=\"Previous frame (←)\">⏮<\u002Fbutton>\n          <button class=\"ctrlbtn primary\" id=\"playBtn\" title=\"Play/Pause (Space)\">▶<\u002Fbutton>\n          <button class=\"ctrlbtn\" id=\"stepFwdBtn\" title=\"Next frame (→)\">⏭<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:10px\">\n          <label>Speed<\u002Flabel>\n          <select id=\"speedSelect\">\n            <option value=\"0.25\">0.25×<\u002Foption>\n            <option value=\"0.5\">0.5×<\u002Foption>\n            <option value=\"1\" selected=\"\">1×<\u002Foption>\n            <option value=\"2\">2×<\u002Foption>\n            <option value=\"4\">4×<\u002Foption>\n            <option value=\"8\">8×<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <h3>Pitch<\u002Fh3>\n        <div class=\"row\"><label>Length (m)<\u002Flabel><input type=\"number\" id=\"pitchLenInput\" class=\"mini\" min=\"90\" max=\"130\" step=\"0.5\" value=\"105\" style=\"width:64px\"><\u002Fdiv>\n        <div class=\"row\"><label>Width (m)<\u002Flabel><input type=\"number\" id=\"pitchWidInput\" class=\"mini\" min=\"55\" max=\"100\" step=\"0.5\" value=\"68\" style=\"width:64px\"><\u002Fdiv>\n        <div class=\"note\" style=\"margin-top:10px\">Points far outside the pitch (e.g. substitutes on the bench) simply aren't drawn.<\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"collapsible\" data-comment-anchor=\"b720efc9a9-section\">\n        <h3>Display<span class=\"caret\">▼<\u002Fspan><\u002Fh3>\n        <div class=\"secBody\">\n        <div class=\"row\"><label>Player trails<\u002Flabel><div class=\"toggle on\" id=\"toggleTrails\"><i><\u002Fi><\u002Fdiv><\u002Fdiv>\n        <div class=\"row\"><label>Ball trail<\u002Flabel><div class=\"toggle on\" id=\"toggleBallTrail\"><i><\u002Fi><\u002Fdiv><\u002Fdiv>\n        <div class=\"row\"><label>Trail length<\u002Flabel><input type=\"range\" class=\"mini\" id=\"trailLen\" min=\"3\" max=\"60\" value=\"15\"><\u002Fdiv>\n        <div class=\"row\"><label>Show player labels<\u002Flabel><div class=\"toggle on\" id=\"toggleLabels\"><i><\u002Fi><\u002Fdiv><\u002Fdiv>\n        <div class=\"row\"><label>Label style<\u002Flabel>\n          <select id=\"labelStyleSelect\">\n            <option value=\"number\" selected=\"\">Number<\u002Foption>\n            <option value=\"name\">Name<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"row\"><label>Detected positions only<\u002Flabel><div class=\"toggle\" id=\"toggleDetectedOnly\"><i><\u002Fi><\u002Fdiv><\u002Fdiv>\n        <div class=\"row\" id=\"teamColorRow\">\n          <label id=\"teamALabel\">Team A colour<\u002Flabel>\n          <span style=\"display:flex;gap:6px;align-items:center\">\n            <input type=\"color\" id=\"teamAColor\" value=\"#32fe6b\">\n            <input type=\"text\" id=\"teamAHex\" class=\"hexInput\" maxlength=\"7\" value=\"#32fe6b\" placeholder=\"#RRGGBB\">\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"row\">\n          <label id=\"teamBLabel\">Team B colour<\u002Flabel>\n          <span style=\"display:flex;gap:6px;align-items:center\">\n            <input type=\"color\" id=\"teamBColor\" value=\"#7acbff\">\n            <input type=\"text\" id=\"teamBHex\" class=\"hexInput\" maxlength=\"7\" value=\"#7acbff\" placeholder=\"#RRGGBB\">\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"note\" style=\"margin-top:10px\">If a colour swatch doesn't respond to clicks (seen on some Chrome versions), type or paste the hex code instead.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div id=\"analyticsBar\" class=\"collapsed\">\n    <div class=\"analyticsRow\">\n      <button class=\"pill\" id=\"voronoiBtn\" title=\"Voronoi space-control diagram\">Voronoi<\u002Fbutton>\n      <div id=\"voronoiStat\">\n        <span class=\"teamDot\" id=\"statDotA\"><\u002Fspan><span id=\"statPctA\">–<\u002Fspan>\n        <div class=\"statBar\"><div class=\"statBarA\" id=\"statBarA\"><\u002Fdiv><div class=\"statBarB\" id=\"statBarB\"><\u002Fdiv><\u002Fdiv>\n        <span id=\"statPctB\">–<\u002Fspan><span class=\"teamDot\" id=\"statDotB\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"voronoiTrendWrap\">\n      <div class=\"trendHead\">\n        <span>Space control over match time <span class=\"muted\">(smoothed)<\u002Fspan><\u002Fspan>\n        <span id=\"trendStatus\" class=\"muted\"><\u002Fspan>\n      <\u002Fdiv>\n      <canvas id=\"voronoiTrend\"><\u002Fcanvas>\n      <div class=\"trendLabels\"><span id=\"trendLabelA\">Team A<\u002Fspan><span>50%<\u002Fspan><span id=\"trendLabelB\">Team B<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"timelineWrap\">\n    <input type=\"range\" id=\"scrubber\" min=\"0\" max=\"0\" value=\"0\">\n    <div class=\"tl-labels\"><span id=\"tlStart\">00:00<\u002Fspan><span id=\"tlEnd\">00:00<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"progressOverlay\">\n  <div id=\"progressBarOuter\"><div id=\"progressBarInner\"><\u002Fdiv><\u002Fdiv>\n  <div id=\"progressText\">Loading file…<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  \"use strict\";\n\n  // ---------- state ----------\n  var state = {\n    frames: [],          // dense array, index = position in file order\n    validIdx: [],         // indices into frames[] where timestamp is not null\n    pos: 0,               // pointer into validIdx\n    playing: false,\n    speed: 1,\n    fps: 10,\n    pitchLength: 105,\n    pitchWidth: 68,\n    playerTeam: new Map(),    // id -> 'A' | 'B' | 'REF' | undefined\n    allPlayerIds: [],\n    playerFrames: new Map(),  // id -> frames the player appears in (tracking coverage, not time played)\n    playerSpans: new Map(),   // id -> [{period, tMin, tMax}] — first/last sighting per period\n    showTrails: true,\n    showBallTrail: true,\n    trailLen: 15,\n    showLabels: true,\n    labelStyle: \"number\",   // \"number\" | \"name\" — on-pitch dot label style\n    detectedOnly: false,\n    showVoronoi: false,\n    selectedId: null,          // legend selection — highlighted on the pitch\n    voronoiTimeline: null,      // cached [{t, pct}] smoothed space-control samples across the whole match\n    voronoiTimelineRange: null, // {tMin, tMax} for placing the playback cursor on the trend chart\n    voronoiBands: null,         // one band per period — the trend chart is broken out per period, each with its own x-scale\n    lastFrameTime: null,\n    rafId: null,\n    periodsInfo: [],\n    matchInfo: null   // set from the SkillCorner match.json once both files are loaded\n  };\n  var pendingMatchJson = null; // match.json awaiting merge once tracking frames finish parsing\n  var pendingTrackingFile = null; // File staged in the \"Tracking file\" slot, awaiting the Continue click\n  var pendingMatchFile = null;    // { file, json } staged in the \"Match file\" slot\n\n  var els = {};\n  [\"fileStatus\",\"closeFileBtn\",\"dropzone\",\"mainArea\",\"pitchCanvas\",\"hud\",\n   \"hudClock\",\"hudMeta\",\"hudPossession\",\"playBtn\",\"stepBackBtn\",\"stepFwdBtn\",\"speedSelect\",\n   \"toggleTrails\",\"toggleBallTrail\",\"trailLen\",\"toggleLabels\",\"labelStyleSelect\",\"toggleDetectedOnly\",\n   \"teamColorRow\",\"teamAColor\",\"teamBColor\",\"teamAHex\",\"teamBHex\",\"teamALabel\",\"teamBLabel\",\"legendNote\",\"legendList\",\"legendCount\",\"scrubber\",\n   \"tlStart\",\"tlEnd\",\"progressOverlay\",\"progressBarInner\",\"progressText\",\"pitchWrap\",\"stage\",\n   \"pitchLenInput\",\"pitchWidInput\",\"loadArea\",\n   \"slotTracking\",\"slotMatch\",\"slotTrackingInput\",\"slotMatchInput\",\"slotTrackingFile\",\"slotMatchFile\",\n   \"continueBtn\",\"matchWarning\",\"voronoiBtn\",\"analyticsBar\",\n   \"voronoiStat\",\"statDotA\",\"statDotB\",\"statPctA\",\"statPctB\",\n   \"statBarA\",\"statBarB\",\"voronoiTrendWrap\",\"voronoiTrend\",\"trendStatus\",\"trendLabelA\",\"trendLabelB\"\n  ].forEach(function(id){ els[id] = document.getElementById(id); });\n\n  var ctx = els.pitchCanvas.getContext(\"2d\");\n  var trendCtx = els.voronoiTrend.getContext(\"2d\");\n  var pitchCache = null; // offscreen canvas with static pitch lines\n\n  // ---------- helpers ----------\n  function parseTimestamp(str){\n    if(!str) return null;\n    var parts = str.split(\":\");\n    if(parts.length < 2) return null;\n    var h = parseInt(parts[0],10)||0;\n    var m = parseInt(parts[1],10)||0;\n    var secStr = parts[2] || \"0\";\n    var sec = parseFloat(secStr);\n    if(isNaN(sec)) sec = 0;\n    return h*3600 + m*60 + sec;\n  }\n\n  function fmtClock(sec){\n    if(sec == null) return \"--:--\";\n    var m = Math.floor(sec/60);\n    var s = sec - m*60;\n    return String(m).padStart(2,\"0\") + \":\" + s.toFixed(1).padStart(4,\"0\");\n  }\n\n  function fmtClockShort(sec){\n    if(sec == null) return \"--:--\";\n    var m = Math.floor(sec/60);\n    var s = Math.floor(sec - m*60);\n    return String(m).padStart(2,\"0\") + \":\" + String(s).padStart(2,\"0\");\n  }\n\n  function escapeHtml(s){\n    return String(s).replace(/[&<>\"']/g, function(c){\n      return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c];\n    });\n  }\n\n  function normalizeHex(c){\n    if(!c) return null;\n    c = String(c).trim();\n    if(c.charAt(0) !== \"#\") c = \"#\" + c; // tolerate hex codes typed/pasted without the leading #\n    if(/^#[0-9a-fA-F]{6}$/.test(c)) return c.toLowerCase();\n    if(/^#[0-9a-fA-F]{3}$/.test(c)) return (\"#\"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]).toLowerCase();\n    return null;\n  }\n\n  // full label for the side panel legend (shirt number + name, falls back to raw id)\n  function labelForPlayer(id){\n    var info = state.matchInfo && state.matchInfo.playersByTrackable.get(id);\n    if(info){\n      var n = info.number != null ? (\"#\" + info.number + \" \") : \"\";\n      return (n + (info.name || String(id))).trim();\n    }\n    return String(id);\n  }\n\n  // compact label drawn next to the on-pitch dot — shirt number or short name\n  // depending on state.labelStyle, falling back to the last 4 digits of the id.\n  function shortLabelForPlayer(id){\n    var info = state.matchInfo && state.matchInfo.playersByTrackable.get(id);\n    if(state.labelStyle === \"name\" && info && info.name) return info.name;\n    if(info && info.number != null) return String(info.number);\n    return String(id).slice(-4);\n  }\n\n  // human-readable \"who has the ball\" text for the HUD (name + number if known)\n  function possessionLabel(id){\n    if(id == null) return \"\";\n    var info = state.matchInfo && state.matchInfo.playersByTrackable.get(id);\n    if(info){\n      var n = info.number != null ? (\" #\" + info.number) : \"\";\n      return (info.name || (\"#\" + id)) + n;\n    }\n    return \"#\" + id;\n  }\n\n  function normalizeFrame(obj){\n    var ball = obj.ball_data || obj.ball || null;\n    var playersRaw = obj.player_data || obj.players || obj.player_positions || [];\n    var players = new Array(playersRaw.length);\n    for(var i=0;i<playersRaw.length;i++){\n      var p = playersRaw[i];\n      players[i] = {\n        id: p.player_id != null ? p.player_id : (p.id != null ? p.id : (p.trackable_object != null ? p.trackable_object : p.track_id)),\n        x: p.x, y: p.y,\n        detected: p.is_detected !== undefined ? !!p.is_detected : (p.detected !== undefined ? !!p.detected : true)\n      };\n    }\n    var poss = obj.possession || {};\n    return {\n      frame: obj.frame,\n      t: parseTimestamp(obj.timestamp),\n      tStr: obj.timestamp || null,\n      period: obj.period != null ? obj.period : null,\n      ball: ball ? { x: ball.x, y: ball.y, z: ball.z, detected: ball.is_detected !== undefined ? !!ball.is_detected : true } : null,\n      possPlayer: poss.player_id != null ? poss.player_id : null,\n      possGroup: poss.group || null,\n      players: players\n    };\n  }\n\n  // ---------- file loading ----------\n  function resetState(){\n    state.frames = []; state.validIdx = []; state.pos = 0; state.playing = false;\n    state.playerTeam = new Map(); state.allPlayerIds = []; state.playerFrames = new Map(); state.playerSpans = new Map();\n    state.periodsInfo = []; state.matchInfo = null;\n    state.voronoiTimeline = null; state.voronoiTimelineRange = null; state.voronoiBands = null; voronoiTrendCache = null;\n    els.voronoiStat.classList.remove(\"show\");\n    els.voronoiTrendWrap.classList.remove(\"show\");\n    pendingMatchJson = null;\n    cancelPlayback();\n  }\n\n  function clearSlots(){\n    pendingTrackingFile = null; pendingMatchFile = null;\n    updateSlotUI();\n  }\n\n  function showProgress(frac, text){\n    els.progressOverlay.style.display = \"flex\";\n    els.progressBarInner.style.width = (frac*100).toFixed(1) + \"%\";\n    if(text) els.progressText.textContent = text;\n  }\n  function hideProgress(){ els.progressOverlay.style.display = \"none\"; }\n\n  // classifies a dropped/selected file as the (small) match.json or the tracking file,\n  // purely from its content — so it doesn't matter which of the two slots receives it.\n  async function classifyFile(f){\n    if(f.size <= 2000000){\n      try{\n        var text = await f.text();\n        var obj = JSON.parse(text);\n        if(obj && !Array.isArray(obj) && (obj.home_team || obj.players)){\n          return { type: \"match\", file: f, json: obj };\n        }\n      } catch(e){ /* not a standalone match.json object, fall through to tracking */ }\n    }\n    return { type: \"tracking\", file: f };\n  }\n\n  // stages files into the two slots (auto-routed by content); the viewer only opens\n  // once both slots are filled and the user clicks \"Continue to viewer\".\n  async function ingestFilesForSlots(fileList){\n    var files = Array.from(fileList || []).filter(Boolean);\n    for(var i=0;i<files.length;i++){\n      var classified = await classifyFile(files[i]);\n      if(classified.type === \"match\") pendingMatchFile = classified;\n      else pendingTrackingFile = classified.file;\n    }\n    updateSlotUI();\n  }\n\n  function updateSlotUI(){\n    els.slotTracking.classList.toggle(\"filled\", !!pendingTrackingFile);\n    els.slotTrackingFile.textContent = pendingTrackingFile ? pendingTrackingFile.name : \"Drag here or click\";\n    els.slotTrackingFile.classList.toggle(\"empty\", !pendingTrackingFile);\n    els.slotTrackingFile.classList.toggle(\"ok\", !!pendingTrackingFile);\n\n    els.slotMatch.classList.toggle(\"filled\", !!pendingMatchFile);\n    els.slotMatchFile.textContent = pendingMatchFile ? pendingMatchFile.file.name : \"Drag here or click\";\n    els.slotMatchFile.classList.toggle(\"empty\", !pendingMatchFile);\n    els.slotMatchFile.classList.toggle(\"ok\", !!pendingMatchFile);\n\n    var ready = !!pendingTrackingFile && !!pendingMatchFile;\n    els.continueBtn.classList.toggle(\"ready\", ready);\n    els.continueBtn.disabled = !ready;\n  }\n\n  function continueToViewer(){\n    if(!(pendingTrackingFile && pendingMatchFile)) return;\n    var matchJson = pendingMatchFile.json;\n    // handleFile() calls resetState() synchronously (which clears pendingMatchJson) before\n    // kicking off the async FileReader — so set it *after* that call returns, still\n    // well before the reader's onload/finishLoad fires.\n    handleFile(pendingTrackingFile);\n    pendingMatchJson = matchJson;\n  }\n\n  function handleFile(file){\n    if(!file) return;\n    resetState();\n    showProgress(0, \"Reading \" + file.name + \"…\");\n    els.fileStatus.textContent = file.name;\n\n    var reader = new FileReader();\n    reader.onerror = function(){\n      hideProgress();\n      alert(\"Could not read the file.\");\n    };\n    reader.onload = function(e){\n      var text = e.target.result;\n      var trimmed = text.trimStart();\n      if(trimmed.charAt(0) === \"[\"){\n        showProgress(0.3, \"Parsing JSON array…\");\n        setTimeout(function(){ parseJsonArray(text); }, 10);\n      } else {\n        parseJsonLines(text);\n      }\n    };\n    reader.readAsText(file);\n  }\n\n  function parseJsonArray(text){\n    var arr;\n    try { arr = JSON.parse(text); }\n    catch(err){ hideProgress(); alert(\"Could not parse JSON: \" + err.message); return; }\n    if(!Array.isArray(arr)){\n      if(Array.isArray(arr.data)) arr = arr.data;\n      else if(Array.isArray(arr.tracking_data)) arr = arr.tracking_data;\n      else if(Array.isArray(arr.frames)) arr = arr.frames;\n      else { hideProgress(); alert(\"No frame array found in the JSON file.\"); return; }\n    }\n    var total = arr.length, i = 0, frames = new Array(total);\n    var CHUNK = 3000;\n    function step(){\n      var end = Math.min(i+CHUNK, total);\n      for(; i<end; i++) frames[i] = normalizeFrame(arr[i]);\n      showProgress(i/total, \"Processing frames \" + i + \" / \" + total);\n      if(i < total) setTimeout(step, 0);\n      else finishLoad(frames);\n    }\n    step();\n  }\n\n  function parseJsonLines(text){\n    var lines = text.split(\"\\n\");\n    var total = lines.length;\n    var frames = [];\n    var i = 0;\n    var CHUNK = 4000;\n    function step(){\n      var end = Math.min(i+CHUNK, total);\n      for(; i<end; i++){\n        var line = lines[i];\n        if(!line || !line.trim()) continue;\n        var obj;\n        try { obj = JSON.parse(line); } catch(err){ continue; }\n        frames.push(normalizeFrame(obj));\n      }\n      showProgress(i/total, \"Processing line \" + i + \" / \" + total);\n      if(i < total) setTimeout(step, 0);\n      else finishLoad(frames);\n    }\n    step();\n  }\n\n  var lastStatsStr = \"\";\n\n  // builds the header's team-vs-team overview (colour chip + name + score + colour chip)\n  // so it's obvious at a glance which colour belongs to which side. Re-run whenever the\n  // team colour pickers change so the chips never go stale.\n  function renderMatchHeader(statsStr){\n    if(statsStr !== undefined) lastStatsStr = statsStr;\n    if(!state.matchInfo) return;\n    var mi = state.matchInfo;\n    var matchIdStr = mi.matchId != null ? (\"· Match \" + escapeHtml(mi.matchId) + \" \") : \"\";\n    els.fileStatus.innerHTML =\n      '<span class=\"teamChip\" style=\"background:' + els.teamAColor.value + '\"><\u002Fspan>' +\n      '<b>' + escapeHtml(mi.homeName) + '<\u002Fb>' +\n      '<span class=\"score\">' + escapeHtml(mi.scoreStr) + '<\u002Fspan>' +\n      '<b>' + escapeHtml(mi.awayName) + '<\u002Fb>' +\n      '<span class=\"teamChip\" style=\"background:' + els.teamBColor.value + '\"><\u002Fspan>' +\n      '<span class=\"muted\">' + matchIdStr + '· ' + escapeHtml(lastStatsStr) + '<\u002Fspan>';\n  }\n\n  // merges SkillCorner match metadata (teams, kit colours, player roster, pitch size)\n  // into the current session so team colours/labels/pitch size are set automatically.\n  function applyMatchInfo(matchJson){\n    if(!matchJson) return;\n    var home = matchJson.home_team || {};\n    var away = matchJson.away_team || {};\n    var homeKit = matchJson.home_team_kit || {};\n    var awayKit = matchJson.away_team_kit || {};\n    var players = matchJson.players || matchJson.player_roster || [];\n\n    // Which id links match.json players[] to tracking player_data[].player_id varies by\n    // export: some use trackable_object, others (seen with data_version=3.0) use the\n    // player's own `id`. Index both so either convention resolves.\n    var playersByTrackable = new Map();\n    players.forEach(function(p){\n      var info = {\n        name: p.short_name || ((p.first_name||\"\") + \" \" + (p.last_name||\"\")).trim(),\n        number: p.number != null ? p.number : null,\n        teamId: p.team_id,\n        role: p.player_role ? p.player_role.acronym : null\n      };\n      if(p.trackable_object != null) playersByTrackable.set(p.trackable_object, info);\n      if(p.id != null) playersByTrackable.set(p.id, info);\n    });\n\n    var homeName = home.short_name || home.name || home.acronym || \"Home\";\n    var awayName = away.short_name || away.name || away.acronym || \"Away\";\n    var scoreStr = (matchJson.home_team_score != null && matchJson.away_team_score != null)\n      ? (matchJson.home_team_score + \" : \" + matchJson.away_team_score) : \"vs\";\n\n    state.matchInfo = {\n      home: home, away: away,\n      homeName: homeName, awayName: awayName, scoreStr: scoreStr,\n      matchId: matchJson.id != null ? matchJson.id : null,\n      playersByTrackable: playersByTrackable,\n      title: homeName + \" \" + scoreStr + \" \" + awayName\n    };\n\n    if(matchJson.pitch_length) els.pitchLenInput.value = matchJson.pitch_length;\n    if(matchJson.pitch_width) els.pitchWidInput.value = matchJson.pitch_width;\n    state.pitchLength = parseFloat(els.pitchLenInput.value) || 105;\n    state.pitchWidth = parseFloat(els.pitchWidInput.value) || 68;\n\n    // Kit colours from match.json are deliberately NOT applied to the two pickers — real\n    // jersey hexes are often near-identical or near-black and read badly on the dark pitch.\n    // The viewer's defaults (Team A #32fe6b / Team B #7acbff) stay put; recolour by hand.\n    var homeColor = null;\n    var awayColor = null;\n    if(homeColor) els.teamAColor.value = homeColor;\n    if(awayColor) els.teamBColor.value = awayColor;\n    syncHexInputs();\n\n    state.allPlayerIds.forEach(function(id){\n      var info = playersByTrackable.get(id);\n      if(!info) return;\n      if(home.id != null && info.teamId === home.id) state.playerTeam.set(id, \"A\");\n      else if(away.id != null && info.teamId === away.id) state.playerTeam.set(id, \"B\");\n    });\n  }\n\n  function finishLoad(frames){\n    showProgress(0.98, \"Analyzing data…\");\n    setTimeout(function(){\n      state.frames = frames;\n      var validIdx = [];\n      var idSet = new Set();\n      var frameCount = new Map();\n      var spans = new Map();\n      var lastT = null, deltas = [];\n      var periodSeen = {};\n      var periodsOrder = [];\n      for(var i=0;i<frames.length;i++){\n        var f = frames[i];\n        if(f.t != null){\n          validIdx.push(i);\n          if(lastT != null){\n            var d = f.t - lastT;\n            if(d > 0 && d < 1) deltas.push(d);\n          }\n          lastT = f.t;\n          if(f.period != null && !periodSeen[f.period]){\n            periodSeen[f.period] = true; periodsOrder.push(f.period);\n          }\n        } else {\n          lastT = null;\n        }\n        for(var j=0;j<f.players.length;j++){\n          var p = f.players[j];\n          if(p.id == null) continue;\n          idSet.add(p.id);\n          frameCount.set(p.id, (frameCount.get(p.id) || 0) + 1);\n          // Time on pitch is the span between first and last sighting in each period, NOT the\n          // number of tracked frames: single-camera tracking loses players who are off-camera\n          // (a keeper is undetected for long stretches while play is up the other end), so a\n          // frame count badly understates minutes played.\n          if(f.t != null){\n            var sp = spans.get(p.id);\n            if(!sp){ sp = []; spans.set(p.id, sp); }\n            var cur = sp[sp.length-1];\n            if(!cur || cur.period !== f.period){ sp.push({ period: f.period, tMin: f.t, tMax: f.t }); }\n            else { cur.tMax = f.t; }\n          }\n        }\n      }\n      state.playerFrames = frameCount;\n      state.playerSpans = spans;\n      state.validIdx = validIdx;\n      state.pos = 0;\n      state.pitchLength = parseFloat(els.pitchLenInput.value) || 105;\n      state.pitchWidth = parseFloat(els.pitchWidInput.value) || 68;\n      state.periodsInfo = periodsOrder;\n\n      if(deltas.length){\n        deltas.sort(function(a,b){return a-b;});\n        var median = deltas[Math.floor(deltas.length/2)];\n        if(median > 0) state.fps = Math.round((1/median)*100)/100;\n      }\n\n      var ids = Array.from(idSet).sort(function(a,b){\n        return (typeof a === \"number\" && typeof b === \"number\") ? a-b : String(a).localeCompare(String(b));\n      });\n      state.allPlayerIds = ids;\n\n      if(pendingMatchJson){\n        applyMatchInfo(pendingMatchJson);\n        pendingMatchJson = null;\n      }\n\n      if(state.matchInfo){\n        var matched = ids.filter(function(id){ return state.matchInfo.playersByTrackable.has(id); }).length;\n        var rate = ids.length ? matched / ids.length : 0;\n        if(rate < 0.3){\n          els.matchWarning.textContent = \"⚠ Match file may not correspond to the tracking file (only \" + matched + \"/\" + ids.length + \" players matched)\";\n          els.matchWarning.style.display = \"inline\";\n        } else {\n          els.matchWarning.style.display = \"none\";\n        }\n      } else {\n        els.matchWarning.style.display = \"none\";\n      }\n\n      hideProgress();\n      els.loadArea.style.display = \"none\";\n      els.mainArea.style.display = \"flex\";\n      els.closeFileBtn.style.display = \"inline-block\";\n      var statsStr = validIdx.length.toLocaleString() + \" frames with data  ·  ~\" + state.fps.toFixed(1) + \" Hz  ·  \" + ids.length + \" players\";\n      if(state.matchInfo){\n        renderMatchHeader(statsStr);\n      } else {\n        els.fileStatus.textContent = els.fileStatus.textContent + \"  ·  \" + statsStr;\n      }\n\n      buildLegend();\n      resizeCanvases();\n      drawTimeline();\n      renderFrame();\n    }, 10);\n  }\n\n  // Team A/B are the viewer's own slots; once a match file names the sides, show those names\n  // everywhere the slots are surfaced (colour rows, legend groups, the assignment hint).\n  function teamName(slot){\n    var mi = state.matchInfo;\n    if(mi){\n      if(slot === \"A\" && mi.homeName) return mi.homeName;\n      if(slot === \"B\" && mi.awayName) return mi.awayName;\n    }\n    return slot === \"A\" ? \"Team A\" : slot === \"B\" ? \"Team B\" : slot === \"REF\" ? \"Referees\" : \"Unassigned\";\n  }\n  function updateTeamLabels(){\n    els.teamALabel.textContent = teamName(\"A\") + \" colour\";\n    els.teamBLabel.textContent = teamName(\"B\") + \" colour\";\n    els.legendNote.textContent = \"Click a player to highlight them on the pitch.\";\n  }\n\n  // ---------- legend ----------\n  // Outfield roles run back-to-front so the list reads like a team sheet; anything the match\n  // file doesn't name falls to the bottom of its team.\n  var ROLE_ORDER = [\"GK\",\"LB\",\"LCB\",\"CB\",\"RCB\",\"RB\",\"LWB\",\"RWB\",\"DM\",\"LDM\",\"RDM\",\"CM\",\"LCM\",\"RCM\",\"AM\",\"LM\",\"RM\",\"LW\",\"RW\",\"LF\",\"CF\",\"RF\",\"ST\",\"SS\"];\n  function roleRank(role){\n    if(!role) return 999;\n    var i = ROLE_ORDER.indexOf(String(role).toUpperCase());\n    return i < 0 ? 998 : i;\n  }\n  function minutesForPlayer(id){\n    var sp = state.playerSpans.get(id);\n    if(!sp || !sp.length) return 0;\n    var secs = 0;\n    sp.forEach(function(s){ secs += Math.max(0, s.tMax - s.tMin); });\n    return secs / 60;\n  }\n  // share of that on-pitch window in which the player was actually tracked\n  function coverageForPlayer(id){\n    var mins = minutesForPlayer(id);\n    if(mins <= 0) return null;\n    var tracked = (state.playerFrames.get(id) || 0) / Math.max(0.001, state.fps) / 60;\n    return Math.min(1, tracked / mins);\n  }\n  function roleForPlayer(id){\n    var info = state.matchInfo && state.matchInfo.playersByTrackable.get(id);\n    return info && info.role ? info.role : null;\n  }\n  // Team A first, then B, then referees, then unassigned; within a team by position, then by\n  // minutes on pitch descending (starters above substitutes).\n  function legendSortKey(id){\n    var t = state.playerTeam.get(id);\n    var teamRank = t === \"A\" ? 0 : t === \"B\" ? 1 : t === \"REF\" ? 2 : 3;\n    return [teamRank, roleRank(roleForPlayer(id)), -minutesForPlayer(id)];\n  }\n  function sortedPlayerIds(){\n    return state.allPlayerIds.slice().sort(function(a,b){\n      var ka = legendSortKey(a), kb = legendSortKey(b);\n      for(var i=0;i<ka.length;i++){ if(ka[i] !== kb[i]) return ka[i] - kb[i]; }\n      return String(labelForPlayer(a)).localeCompare(String(labelForPlayer(b)));\n    });\n  }\n\n  function buildLegend(){\n    updateTeamLabels();\n    var html = \"\";\n    var lastTeam = null;\n    sortedPlayerIds().forEach(function(id){\n      var t = state.playerTeam.get(id);\n      if(t !== lastTeam){\n        lastTeam = t;\n        var heading = teamName(t);\n        html += playerTeam.get(id);\n    if(team === \"A\") return els.teamAColor.value;\n    if(team === \"B\") return els.teamBColor.value;\n    if(team === \"REF\") return \"#cdcbc4\";\n    return \"#56564f\";\n  }\n\n  function refreshLegendColors(){\n    els.legendList.querySelectorAll(\"[data-swatch]\").forEach(function(sw){\n      var id = matchIdType(sw.getAttribute(\"data-swatch\"));\n      sw.style.background = colorForPlayer(id);\n    });\n    els.legendList.querySelectorAll(\"[data-grp]\").forEach(function(g){\n      var id = matchIdType(g.getAttribute(\"data-grp\"));\n      g.textContent = state.playerTeam.get(id) || \"–\";\n    });\n  }\n\n  // ---------- pitch drawing ----------\n  function resizeCanvases(){\n    var wrap = els.pitchWrap;\n    var w = Math.max(300, wrap.clientWidth - 20);\n    var h = Math.max(200, wrap.clientHeight - 20);\n    var targetRatio = state.pitchLength / state.pitchWidth;\n    var cw = w, ch = w / targetRatio;\n    if(ch > h){ ch = h; cw = h * targetRatio; }\n    els.pitchCanvas.width = Math.round(cw * devicePixelRatio);\n    els.pitchCanvas.height = Math.round(ch * devicePixelRatio);\n    els.pitchCanvas.style.width = Math.round(cw) + \"px\";\n    els.pitchCanvas.style.height = Math.round(ch) + \"px\";\n    pitchCache = null;\n\n  }\n\n  function getTransform(){\n    var W = els.pitchCanvas.width, H = els.pitchCanvas.height;\n    var margin = 0.06 * Math.min(W,H);\n    var scale = Math.min((W - margin*2)/state.pitchLength, (H - margin*2)/state.pitchWidth);\n    return { ox: W/2, oy: H/2, scale: scale };\n  }\n\n  function toPx(x,y,tr){ return [tr.ox + x*tr.scale, tr.oy - y*tr.scale]; }\n\n  function buildPitchCache(){\n    var W = els.pitchCanvas.width, H = els.pitchCanvas.height;\n    var oc = document.createElement(\"canvas\");\n    oc.width = W; oc.height = H;\n    var c = oc.getContext(\"2d\");\n    var tr = getTransform();\n    var L = state.pitchLength, Wd = state.pitchWidth;\n\n    // turf stripes\n    var stripes = 12;\n    for(var i=0;i<stripes;i++){\n      c.fillStyle = (i%2===0) ? \"#141414\" : \"#191919\";\n      var x0 = -L/2 + i*(L/stripes);\n      var p0 = toPx(x0, Wd/2, tr), p1 = toPx(x0 + L/stripes, -Wd/2, tr);\n      c.fillRect(p0[0], p0[1], p1[0]-p0[0], p1[1]-p0[1]);\n    }\n\n    c.strokeStyle = \"rgba(236,234,228,.42)\";\n    c.lineWidth = Math.max(1.5, tr.scale*0.03);\n    c.lineCap = \"round\";\n\n    function rectM(x,y,w,h){\n      var a = toPx(x-w/2, y+h/2, tr), b = toPx(x+w/2, y-h/2, tr);\n      c.strokeRect(a[0], a[1], b[0]-a[0], b[1]-a[1]);\n    }\n    function lineM(x1,y1,x2,y2){\n      var a = toPx(x1,y1,tr), b = toPx(x2,y2,tr);\n      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();\n    }\n    function circleM(x,y,r,a0,a1){\n      var center = toPx(x,y,tr);\n      c.beginPath();\n      c.ellipse(center[0], center[1], r*tr.scale, r*tr.scale, 0, a0||0, a1||Math.PI*2);\n      c.stroke();\n    }\n\n    // outer boundary\n    rectM(0,0,L,Wd);\n    // halfway line\n    lineM(0, Wd/2, 0, -Wd/2);\n    // center circle + spot\n    circleM(0,0,9.15);\n    c.fillStyle = \"rgba(236,234,228,.42)\";\n    var cs = toPx(0,0,tr); c.beginPath(); c.arc(cs[0],cs[1], Math.max(2,tr.scale*0.05), 0, Math.PI*2); c.fill();\n\n    [ -1, 1 ].forEach(function(side){\n      var gx = side * L/2;\n      var dir = -side;\n      // penalty area 40.32 x 16.5\n      rectM(gx + dir*16.5/2, 0, 16.5, 40.32);\n      // goal area 18.32 x 5.5\n      rectM(gx + dir*5.5/2, 0, 5.5, 18.32);\n      // penalty spot\n      var sp = toPx(gx + dir*11, 0, tr);\n      c.beginPath(); c.arc(sp[0], sp[1], Math.max(2,tr.scale*0.05), 0, Math.PI*2); c.fill();\n      // goal (small rectangle behind line)\n      var ga = toPx(gx, 3.66, tr), gb = toPx(gx + dir*2.4, -3.66, tr);\n      c.strokeRect(Math.min(ga[0],gb[0]), Math.min(ga[1],gb[1]), Math.abs(gb[0]-ga[0])||2, Math.abs(gb[1]-ga[1]));\n      // penalty arc (approx via clipped circle)\n      var ang = side>0 ? [Math.PI*0.72, Math.PI*1.28] : [ -Math.PI*0. =0;i<points.length;i++){\n      var pi = points[i];\n      var poly = pitchRectPoly();\n      for(var j=0;j<points.length && poly.length;j++){\n        if(j === i) continue;\n        var pj = points[j];\n        var nx = pj.x - pi.x, ny = pj.y - pi.y;\n        if(nx === 0 && ny === 0) continue; // coincident points — no bisector, nothing to clip\n        var mx = (pi.x+pj.x)/2, my = (pi.y+pj.y)/2;\n        poly = clipHalfPlane(poly, mx, my, nx, ny);\n      }\n      cells.push({ id: pi.id, poly: poly });\n    }\n    return cells;\n  }\n\n  // shoelace formula — polygon area in whatever units its coordinates are in (pitch metres here)\n  function polygonArea(poly){\n    var area = 0, n = poly.length;\n    for(var i=0;i<n;i++){\n      var a = poly[i], b = poly[(i+1)%n];\n      area += a.x*b.y - b.x*a.y;\n    }\n    return Math.abs(area)/2;\n  }\n\n  function voronoiPointsForFrame(f){\n    return f.players.filter(function(p){\n      return p.id != null && p.x != null && p.y != null && (!state.detectedOnly || p.detected);\n    });\n  }\n\n  // Team A's share of pitch area (0-100), or null if either team has no on-pitch cell this frame.\n  function frameTeamAreaPct(f){\n    var pts = voronoiPointsForFrame(f);\n    if(pts.length < 2) return null;\n    var cells = computeVoronoiCells(pts);\n    var aArea = 0, bArea = 0;\n    cells.forEach(function(c){\n      if(c.poly.length < 3) return;\n      var team = state.playerTeam.get(c.id);\n      if(team === \"A\") aArea += polygonArea(c.poly);\n      else if(team === \"B\") bArea += polygonArea(c.poly);\n    });\n    var total = aArea + bArea;\n    return total > 0 ? (aArea/total*100) : null;\n  }\n\n  function drawVoronoi(f, tr){\n    var pts = voronoiPointsForFrame(f);\n    if(pts.length < 2){ updateVoronoiStat(null); return; }\n    var cells = computeVoronoiCells(pts);\n    var aArea = 0, bArea = 0;\n    cells.forEach(function(c){\n      if(c.poly.length < 3) return;\n      var col = colorForPlayer(c.id);\n      ctx.beginPath(
